<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>MatchCat · 智能别名匹配</title>
    <style id="spiral-styles">/* __SPIRAL_CSS__ */</style>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #root,
      .nc-root {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--color-background, #f9f8f8);
        overflow: hidden;
      }

      .mc-shell {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        min-width: 0;
      }
      .mc-shell > .aviala-pagehead {
        flex: none;
        padding-inline: var(--padding-big, 14px);
      }

      .mc-body {
        flex: 1 1 auto;
        min-height: 0;
      }
      .mc-body-inner {
        display: flex;
        flex-direction: column;
        gap: var(--gap-component-space, 8px);
        padding: var(--padding-middle, 10px) var(--padding-big, 14px) var(--padding-big, 14px);
      }

      .mc-foot {
        flex: none;
        padding: var(--padding-middle, 10px) var(--padding-big, 14px);
        background: var(--box-box-normal-background-whiteonly, #ffffff);
        border-top: 1px solid var(--border-border-normal-1, #f0efef);
      }

      .mc-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--gap-component-space, 8px);
        min-width: 0;
      }
      .mc-row--tight {
        gap: var(--gap-inside, 4px);
      }
      .mc-grow {
        flex: 1 1 0;
        min-width: 0;
      }
      .mc-push {
        margin-inline-start: auto;
      }

      .mc-field {
        display: flex;
        flex-direction: column;
        gap: var(--gap-inside, 4px);
        min-width: 0;
      }
      .mc-field label {
        color: var(--typography-caption-fg, #616060);
        font-size: var(--typography-caption-size, 0.75rem);
      }
      .mc-switch {
        display: inline-flex;
        align-items: center;
        gap: var(--gap-inside, 4px);
      }
      .mc-pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--gap-component-space, 8px);
        min-width: 0;
      }
      .mc-hint {
        color: var(--typography-caption-fg, #616060);
        font-size: var(--typography-caption-size, 0.75rem);
      }
      .mc-empty {
        padding: var(--padding-middle, 10px);
      }

      .mc-step {
        min-width: 0;
        overflow: hidden;
      }
      .mc-step[data-disabled='true'] {
        opacity: 0.55;
      }
      .mc-step-head {
        display: flex;
        align-items: center;
        gap: var(--gap-inside, 4px);
        width: 100%;
        margin: 0;
        padding: 8px var(--padding-middle, 10px);
        border: 0;
        background: transparent;
        cursor: pointer;
        text-align: left;
        color: inherit;
        font: inherit;
      }
      .mc-step-head:disabled {
        cursor: not-allowed;
      }
      .mc-step-index {
        flex: none;
        width: 20px;
        height: 20px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: var(--typography-caption-size, 0.75rem);
        background: var(--box-box-theme-lightbackground, #ffe9e3);
        color: var(--text-text-theme-primary-black, #bf2300);
      }
      .mc-step[data-open='true'] .mc-step-index {
        background: var(--text-text-theme-primary-black, #bf2300);
        color: #fff;
      }
      .mc-step-title {
        flex: 1 1 auto;
        min-width: 0;
        font-size: var(--typography-text-size, 0.875rem);
        font-weight: 600;
      }
      .mc-step-body {
        padding-top: 0;
      }

      .mc-chip {
        display: inline-block;
        width: 16px;
        height: 16px;
        flex: none;
        border-radius: 999px;
        border: 1px solid var(--border-border-normal-2, #e0dfdf);
        vertical-align: middle;
      }

      .mc-path {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px;
        min-width: 0;
        font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, monospace;
        font-size: var(--typography-caption-size, 0.75rem);
      }
      .mc-path-part {
        display: inline-flex;
        align-items: center;
        min-width: 0;
      }
      .mc-path-sep {
        opacity: 0.45;
        margin-inline: 1px;
      }
      .mc-path-dim {
        opacity: 0.5;
        font-weight: 400;
      }
      .mc-path-hit {
        font-weight: 600;
      }

      .mc-family {
        border-bottom: 1px solid var(--border-border-normal-1, #f0efef);
      }
      .mc-family-head {
        display: flex;
        align-items: center;
        gap: var(--gap-inside, 4px);
        padding: 6px var(--padding-middle, 10px);
        background: var(--box-box-normal-background, #fafafa);
        position: sticky;
        top: 0;
        z-index: 1;
      }
      .mc-family-toggle {
        display: flex;
        flex: 1 1 auto;
        min-width: 0;
        align-items: center;
        gap: 6px;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        text-align: left;
        color: inherit;
        font: inherit;
      }
      .mc-family-key {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, monospace;
        font-size: var(--typography-caption-size, 0.75rem);
        font-weight: 600;
      }
      .mc-family-tags {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
      }

      .mc-match {
        display: flex;
        flex-direction: column;
        gap: var(--gap-inside, 4px);
        padding: 6px var(--padding-middle, 10px);
        border-bottom: 1px solid var(--border-border-normal-1, #f0efef);
      }
      .mc-match:last-child {
        border-bottom: none;
      }
      .mc-match-source {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .mc-match-title {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        padding-inline-start: 22px;
      }
      .mc-match-target {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding-inline-start: 22px;
      }
      .mc-match-target-head {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .mc-banner {
        font-size: var(--typography-caption-size, 0.75rem);
        color: var(--text-text-theme-primary-black, #bf2300);
        background: var(--box-box-theme-lightbackground, #ffe9e3);
        border-radius: 6px;
        padding: 6px 8px;
      }
      .mc-banner--ok {
        color: #186a3b;
        background: #e8f5e9;
      }

      .mc-list-shell {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .mc-list {
        height: 160px;
        overflow: auto;
        background: var(--box-box-normal-background-whiteonly, #ffffff);
        border: 1px solid var(--border-border-normal-1, #f0efef);
        border-radius: 6px 6px 0 0;
      }
      .mc-list-split {
        height: 8px;
        cursor: ns-resize;
        touch-action: none;
        border: 1px solid var(--border-border-normal-1, #f0efef);
        border-top: none;
        border-radius: 0 0 6px 6px;
        background: var(--box-box-normal-background-whiteonly, #ffffff);
        position: relative;
      }
      .mc-list-split::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 28px;
        height: 3px;
        margin: -1.5px 0 0 -14px;
        border-radius: 2px;
        background: var(--border-border-normal-2, #e0dfdf);
      }
      .mc-list-split:hover::after,
      .mc-list-split[data-dragging='true']::after {
        background: var(--text-text-theme-primary-black, #bf2300);
      }

      .mc-result-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: 180px;
        overflow: auto;
        background: var(--box-box-normal-background-whiteonly, #ffffff);
        border: 1px solid var(--border-border-normal-1, #f0efef);
        border-radius: 6px;
        padding: 6px;
      }
      .mc-result-row {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 4px 6px;
        border-radius: 4px;
        background: var(--box-box-normal-background, #fafafa);
      }
      .mc-result-main {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .mc-result-path {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, monospace;
        font-size: var(--typography-caption-size, 0.75rem);
      }
      .mc-result-tag {
        flex: none;
        border-radius: 999px;
        padding: 0 8px;
        line-height: 18px;
        font-size: var(--typography-caption-size, 0.75rem);
        background: var(--box-box-theme-lightbackground, #ffe9e3);
        color: var(--text-text-theme-primary-black, #bf2300);
      }
      .mc-result-tag[data-status='success'] {
        background: #e8f5e9;
        color: #186a3b;
      }
      .mc-result-tag[data-status='skipped'] {
        background: #eceff1;
        color: #455a64;
      }
      .mc-result-tag[data-status='failed'] {
        background: #ffe9e3;
        color: #bf2300;
      }
      .mc-result-error {
        color: var(--text-text-error-primary, #bf2300);
        font-size: var(--typography-caption-size, 0.75rem);
      }

      .mc-resize {
        position: absolute;
        z-index: 30;
        touch-action: none;
        background: transparent;
      }
      .mc-resize--e {
        top: 0;
        right: 0;
        width: 8px;
        height: calc(100% - 14px);
        cursor: ew-resize;
      }
      .mc-resize--e::after {
        content: '';
        position: absolute;
        top: 50%;
        right: 2px;
        width: 3px;
        height: 28px;
        margin-top: -14px;
        border-radius: 2px;
        background: var(--border-border-normal-2, #e0dfdf);
      }
      .mc-resize--s {
        left: 0;
        bottom: 0;
        width: calc(100% - 14px);
        height: 8px;
        cursor: ns-resize;
      }
      .mc-resize--s::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 2px;
        width: 28px;
        height: 3px;
        margin-left: -14px;
        border-radius: 2px;
        background: var(--border-border-normal-2, #e0dfdf);
      }
      .mc-resize--se {
        right: 0;
        bottom: 0;
        width: 14px;
        height: 14px;
        cursor: nwse-resize;
      }
      .mc-resize--se::after {
        content: '';
        position: absolute;
        right: 3px;
        bottom: 3px;
        width: 8px;
        height: 8px;
        border-right: 2px solid var(--border-border-normal-2, #e0dfdf);
        border-bottom: 2px solid var(--border-border-normal-2, #e0dfdf);
      }
      .mc-resize:hover::after,
      .mc-resize[data-dragging='true']::after {
        background: var(--text-text-theme-primary-black, #bf2300);
        border-color: var(--text-text-theme-primary-black, #bf2300);
      }
      .mc-resize--se:hover::after,
      .mc-resize--se[data-dragging='true']::after {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="ui.js"></script>
  </body>
</html>
